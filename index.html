<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Screen">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon.png">
<link rel="icon" href="./icon.png">
<title>Answers Screen</title>
<style>
  :root { --bg:#000; --fg:#f2f2f2; --dim:#8a8a8a; --accent:#ffd166; --font:28px; --strip:260px; --eyew:100px; --lower:#0b1733; --topbar:0px; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--fg);
    font-family:-apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; overflow:hidden; }

  /* ---- stage: the area that shows content ---- */
  #stage { position:absolute; top:0; left:0; right:0; height:100%; display:flex; flex-direction:column;
    padding:calc(10px + env(safe-area-inset-top)) calc(24px + env(safe-area-inset-right)) calc(12px + env(safe-area-inset-bottom)) calc(24px + env(safe-area-inset-left));
    font-size:var(--font); }
  body.strip #stage { height:var(--strip); border-bottom:1px solid #1e1e1e; padding-bottom:12px; }
  body.half { background:var(--lower); }
  body.half #stage { top:var(--topbar); height:50%; background:var(--bg); border-bottom:none; padding-bottom:12px; }
  body.eyes-reserve #stage { padding-bottom:calc(var(--eyew) * 0.84 + 16px + env(safe-area-inset-bottom)); }

  /* ---- eyes: a fixed point to rest your gaze on ---- */
  #eyes { position:fixed; left:50%; bottom:calc(2px + env(safe-area-inset-bottom)); transform:translateX(-50%); width:var(--eyew); z-index:10;
    height:calc(var(--eyew) * 0.84); display:none; pointer-events:none; }
  body.eyes #eyes { display:block; }
  #eyes svg { width:100%; height:100%; display:block; }
  #eyes .eye { transform-box:fill-box; transform-origin:center; transition:transform .07s ease-in; }
  #eyes.blink .eye { transform:scaleY(.06); transition:transform .05s ease-out; }

  #crumb { flex:none; font-size:.5em; color:var(--dim); text-transform:uppercase; letter-spacing:.04em;
    margin-bottom:.35em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #crumb b { color:var(--accent); font-weight:600; }
  #crumb .sep { margin:0 .4em; color:#444; }

  #content { flex:1; min-height:0; display:flex; flex-direction:column; position:relative; }
  #note { flex:none; color:var(--dim); font-size:.7em; margin-bottom:.3em; }
  #note p { margin:0; }

  #menu { flex:1; min-height:0; column-width:11em; column-gap:1.6em; column-fill:auto; overflow:hidden; }
  .item { break-inside:avoid; display:flex; gap:.5em; line-height:1.25; margin-bottom:.22em; }
  .item .n { color:var(--accent); font-variant-numeric:tabular-nums; min-width:1.2em; text-align:right; font-weight:600; }
  .item.cat .t::after { content:" ›"; color:var(--dim); }
  .more { color:#555; font-size:.6em; }

  #answer { flex:1; min-height:0; overflow:hidden; position:relative; }
  .col { margin:0 auto; overflow:hidden; }
  .col .item { margin:0; line-height:inherit; }
  .col .item.bullet { display:flex; align-items:flex-start; gap:.35em; }
  .col .dot { color:var(--accent); flex:none; }
  .col .txt { flex:1; min-width:0; }
  #cat { position:absolute; display:none; pointer-events:none; font-size:.85em; }
  #answer p { margin:0 0 .45em; }
  #answer ul { margin:0 0 .5em; padding-left:1.1em; }
  #answer li { margin-bottom:.12em; }
  #answer code { font-family:ui-monospace, Menlo, monospace; font-size:.85em; color:var(--accent); }
  #counter { position:absolute; right:calc(24px + env(safe-area-inset-right)); bottom:4px; color:var(--dim); font-size:.5em; line-height:1.3; display:none; font-variant-numeric:tabular-nums; }
  #counter.on { display:block; }

  /* ---- butterfly: flashes at the end of a sentence ---- */
  #butterfly { position:absolute; inset:0; display:none; align-items:center; justify-content:center; pointer-events:none; }
  #butterfly svg { height:min(70%, 180px); width:auto; }
  #butterfly .wing { fill:var(--accent); }
  #butterfly .cut { fill:var(--bg); }
  #butterfly .body { fill:var(--fg); }
  #butterfly .ant { fill:none; stroke:var(--fg); stroke-width:3; stroke-linecap:round; }
  body.flash #butterfly { display:flex; animation:pop .35s ease-out forwards; }
  body.flash #answer { visibility:hidden; }
  @keyframes pop { 0% { opacity:0; transform:scale(.6); } 20% { opacity:1; transform:scale(1.05); } 80% { opacity:1; transform:scale(1); } 100% { opacity:0; transform:scale(1); } }

  .empty { color:var(--dim); font-size:.75em; line-height:1.4; }
  .empty kbd, #hints kbd { font-family:ui-monospace, Menlo, monospace; color:var(--accent); }

  #hints { flex:none; font-size:12px; line-height:1.5; color:#555; margin-bottom:6px;
    font-family:ui-monospace, Menlo, monospace; }
  body.nohints #hints { display:none; }

  #blank { position:fixed; inset:0; background:#000; display:none; z-index:50; }
  body.blank #blank { display:block; }

  #toast { position:fixed; left:50%; bottom:calc(24px + env(safe-area-inset-bottom)); transform:translateX(-50%); background:#222; color:#ddd;
    padding:8px 14px; border-radius:8px; font-size:13px; opacity:0; transition:opacity .2s; pointer-events:none; z-index:200; }
  #toast.on { opacity:1; }

  #drop { position:fixed; inset:0; background:#000c; border:3px dashed var(--accent); display:none;
    align-items:center; justify-content:center; font-size:24px; color:var(--accent); z-index:300; }
  body.dragging #drop { display:flex; }

  /* ---- panels ---- */
  .panel { position:fixed; right:calc(16px + env(safe-area-inset-right)); top:calc(16px + env(safe-area-inset-top)); width:380px; max-width:calc(100% - 32px); background:#161616;
    border:1px solid #333; border-radius:10px; padding:16px; font-size:14px; z-index:100; display:none;
    box-shadow:0 10px 40px #000a; color:#ddd; }
  .panel.open { display:block; }
  .panel.wide { width:720px; }
  .panel h3 { margin:0 0 12px; font-size:15px; font-weight:600; }
  .panel label { display:block; margin:10px 0; }
  .panel input[type=range] { width:100%; margin-top:4px; }
  .panel .dim { color:#777; font-size:12px; margin:10px 0 0; }
  .panel textarea { width:100%; height:55vh; background:#0c0c0c; color:#eee; border:1px solid #333; border-radius:6px;
    padding:10px; font-family:ui-monospace, Menlo, monospace; font-size:13px; line-height:1.4; resize:vertical; }
  .panel .row { display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; }
  .panel button { background:#2a2a2a; color:#eee; border:1px solid #444; border-radius:6px; padding:7px 12px;
    font-size:13px; cursor:pointer; }
  .panel button:hover { background:#333; }
  .panel button.primary { background:var(--accent); color:#000; border-color:var(--accent); font-weight:600; }
  .panel .val { color:#999; float:right; }
</style>
</head>
<body>

<div id="stage">
  <div id="hints"></div>
  <div id="crumb"></div>
  <div id="content"></div>
  <div id="counter"></div>
  <div id="butterfly" aria-hidden="true"><svg viewBox="0 0 200 160">
    <g>
      <path class="wing" d="M104 72 C130 40 165 20 192 12 C180 45 165 70 125 84 C118 86 110 82 104 72 Z"/>
      <path class="cut" d="M118 70 C135 50 155 38 175 28 C160 48 145 62 124 76 Z"/>
      <path class="wing" d="M104 88 C125 95 150 115 168 150 C145 140 120 128 108 110 C104 104 102 96 104 88 Z"/>
      <path class="cut" d="M114 98 C130 108 145 122 155 138 C138 126 124 114 114 100 Z"/>
      <path class="ant" d="M103 44 C110 28 118 20 128 14"/>
    </g>
    <g transform="translate(200 0) scale(-1 1)">
      <path class="wing" d="M104 72 C130 40 165 20 192 12 C180 45 165 70 125 84 C118 86 110 82 104 72 Z"/>
      <path class="cut" d="M118 70 C135 50 155 38 175 28 C160 48 145 62 124 76 Z"/>
      <path class="wing" d="M104 88 C125 95 150 115 168 150 C145 140 120 128 108 110 C104 104 102 96 104 88 Z"/>
      <path class="cut" d="M114 98 C130 108 145 122 155 138 C138 126 124 114 114 100 Z"/>
      <path class="ant" d="M103 44 C110 28 118 20 128 14"/>
    </g>
    <ellipse class="body" cx="100" cy="90" rx="6" ry="38"/>
    <circle class="body" cx="100" cy="46" r="7"/>
  </svg></div>
</div>

  <div id="eyes" aria-hidden="true"><svg viewBox="0 0 100 84">
    <g class="eye"><ellipse cx="26" cy="42" rx="23" ry="20" fill="#f2f2f2"/><circle cx="26" cy="42" r="10.5" fill="#3b6ea8"/><circle cx="26" cy="42" r="5.5" fill="#111"/><circle cx="30" cy="37.5" r="2.6" fill="#fff"/></g>
    <g class="eye"><ellipse cx="74" cy="42" rx="23" ry="20" fill="#f2f2f2"/><circle cx="74" cy="42" r="10.5" fill="#3b6ea8"/><circle cx="74" cy="42" r="5.5" fill="#111"/><circle cx="78" cy="37.5" r="2.6" fill="#fff"/></g>
  </svg></div>
<div id="blank"></div>
<div id="drop">Drop your answers .md file</div>
<div id="toast"></div>
<input type="file" id="file" accept=".md,.markdown,.txt" style="display:none">

<div class="panel" id="settings">
  <h3>Settings</h3>
  <label><input type="checkbox" id="optStrip"> Strip mode (only the top band shows content)</label>
  <label><input type="checkbox" id="optHalf"> Top half only (phone behind the lid)</label>
  <label>Top bar height (lowers the content) <span class="val" id="topbarVal"></span><input type="range" id="optTopbar" min="0" max="400" step="5"></label>
  <label>Bar color <span class="val" id="lowerVal"></span><input type="color" id="optLower"></label>
  <label>Strip height <span class="val" id="stripVal"></span><input type="range" id="optStripH" min="100" max="800" step="10"></label>
  <label>Font size <span class="val" id="fontVal"></span><input type="range" id="optFont" min="14" max="80" step="1"></label>
  <label>Column width <span class="val" id="colwVal"></span><input type="range" id="optColW" min="80" max="900" step="5"></label>
  <label><input type="checkbox" id="optEyes"> Show blinking eyes (bottom center, or ⇧⌥Y)</label>
  <label>Eye width <span class="val" id="eyeVal"></span><input type="range" id="optEyeW" min="50" max="240" step="2"></label>
  <label><input type="checkbox" id="optHints"> Show key hints</label>
  <p class="dim">Press <b>S</b> or Esc to close.</p>
</div>

<div class="panel wide" id="editor">
  <h3>Answers (Markdown)</h3>
  <textarea id="mdText" spellcheck="false"></textarea>
  <div class="row">
    <button class="primary" id="btnSave">Save &amp; reload (⌘S)</button>
    <button id="btnOpen">Open file…</button>
    <button id="btnDownload">Download .md</button>
    <button id="btnClear">Clear</button>
  </div>
  <p class="dim">Headings are the drill-down levels. The text under the deepest heading is the answer you read.
    Press <b>E</b> or Esc to close.</p>
</div>


<script>
(() => {
  const $ = s => document.querySelector(s);
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
  };

  // ---------- Markdown -> tree ----------
  function parse(md) {
    const root = { title: 'Home', body: [], children: [], depth: 0, parent: null };
    const stack = [root];
    for (const raw of md.split(/\r?\n/)) {
      const m = raw.match(/^(#{1,6})\s+(.+?)\s*#*\s*$/);
      if (m) {
        const depth = m[1].length;
        while (stack.length > 1 && stack[stack.length - 1].depth >= depth) stack.pop();
        const node = { title: m[2].trim(), body: [], children: [], depth, parent: stack[stack.length - 1] };
        node.parent.children.push(node);
        stack.push(node);
      } else {
        stack[stack.length - 1].body.push(raw);
      }
    }
    return root;
  }
  const esc = s => s.replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
  const inline = s => esc(s)
    .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>')
    .replace(/(^|\s)\*(.+?)\*/g, '$1<i>$2</i>')
    .replace(/`(.+?)`/g, '<code>$1</code>');
  function renderBody(lines) {
    let html = '', para = [], list = [];
    const flushP = () => { if (para.length) { html += '<p>' + inline(para.join(' ')) + '</p>'; para = []; } };
    const flushL = () => { if (list.length) { html += '<ul>' + list.map(l => '<li>' + inline(l) + '</li>').join('') + '</ul>'; list = []; } };
    for (const l of lines) {
      const t = l.trim();
      if (!t) { flushP(); flushL(); continue; }
      const b = t.match(/^[-*•]\s+(.*)/) || t.match(/^\d+[.)]\s+(.*)/);
      if (b) { flushP(); list.push(b[1]); } else { flushL(); para.push(t); }
    }
    flushP(); flushL();
    return html;
  }
  const hasText = n => n.body.some(l => l.trim());
  const countLeaves = n => n.children.length ? n.children.reduce((a, c) => a + countLeaves(c), 0) : 1;

  // ---------- State ----------
  let md = '', root = null, cur = null;
  const settings = {
    strip: store.get('strip', true),
    half: store.get('half', false),
    lower: store.get('lower', '#0b1733'),
    topbar: store.get('topbar', 155),
    stripH: store.get('stripH', 260),
    font: store.get('font', 28),
    colW: store.get('colWidth', 155),
    eyes: store.get('eyesOn', false),
    eyeW: store.get('eyeW', 100),
    hints: store.get('hints', true)
  };

  function applySettings() {
    document.body.classList.toggle('strip', settings.strip && !settings.half);
    document.body.classList.toggle('half', settings.half);
    document.documentElement.style.setProperty('--lower', settings.lower);
    document.documentElement.style.setProperty('--topbar', (settings.half ? settings.topbar : 0) + 'px');
    document.body.classList.toggle('nohints', !settings.hints);
    document.body.classList.toggle('eyes', settings.eyes);
    layoutEyes();
    document.documentElement.style.setProperty('--eyew', settings.eyeW + 'px');
    document.documentElement.style.setProperty('--strip', settings.stripH + 'px');
    document.documentElement.style.setProperty('--font', settings.font + 'px');
    $('#optStrip').checked = settings.strip;
    $('#optHalf').checked = settings.half;
    $('#optLower').value = settings.lower; $('#lowerVal').textContent = settings.lower;
    $('#optTopbar').value = settings.topbar; $('#topbarVal').textContent = settings.topbar + ' px';
    $('#optStripH').value = settings.stripH; $('#stripVal').textContent = settings.stripH + ' px';
    $('#optFont').value = settings.font; $('#fontVal').textContent = settings.font + ' px';
    $('#optColW').value = settings.colW; $('#colwVal').textContent = settings.colW + ' px';
    $('#optEyes').checked = settings.eyes;
    $('#optEyeW').value = settings.eyeW; $('#eyeVal').textContent = settings.eyeW + ' px';
    $('#optHints').checked = settings.hints;
    const storeKey = { eyes: 'eyesOn', colW: 'colWidth' };
    for (const k in settings) store.set(storeKey[k] || k, settings[k]);
    if (cur) render();
  }

  function layoutEyes() {
    const eyeH = settings.eyeW * 0.84 + 8;
    const stripH = settings.half ? window.innerHeight / 2 : settings.stripH;
    const overlap = !(settings.strip || settings.half) || window.innerHeight - eyeH < stripH;
    const isMenu = !cur || cur.children.length > 0;
    document.body.classList.toggle('eyes-reserve', settings.eyes && overlap && isMenu);
  }

  function load(text, label) {
    md = text;
    root = parse(md);
    cur = root;
    store.set('md', md);
    $('#mdText').value = md;
    render();
    if (label) toast(`${label} · ${root.children.length} categories · ${countLeaves(root)} answers`);
  }

  // ---------- Render ----------
  function render() {
    layoutEyes();
    const crumbs = [];
    for (let n = cur; n; n = n.parent) crumbs.unshift(n.title);
    $('#crumb').innerHTML = crumbs.map((c, i) => i === crumbs.length - 1 ? `<b>${esc(c)}</b>` : esc(c)).join('<span class="sep">/</span>');

    const content = $('#content');
    if (cur === root && !root.children.length) {
      content.innerHTML = `<div class="empty">No answers loaded. Press <kbd>E</kbd> to paste Markdown, <kbd>O</kbd> to open a file, or drop a .md file here.</div>`;
      return;
    }
    if (cur.children.length) {
      const note = hasText(cur) ? `<div id="note">${renderBody(cur.body)}</div>` : '';
      const items = cur.children.slice(0, 9).map((c, i) =>
        `<div class="item ${c.children.length ? 'cat' : 'leaf'}"><span class="n">${i + 1}</span><span class="t">${esc(c.title)}</span></div>`).join('');
      const more = cur.children.length > 9 ? `<div class="more">+${cur.children.length - 9} more not reachable (max 9 per level)</div>` : '';
      content.innerHTML = note + `<div id="menu">${items}${more}</div>`;
    } else {
      content.innerHTML = `<div id="answer"><div class="col"></div><div id="cat">🐛</div></div>`;
      layoutAnswer();
    }
    updateCounter();
  }

  // ---------- One item at a time, in a single centered column ----------
  let items = [], itemIdx = 0, lastLeaf = null;
  function extractItems(node) {
    const tmp = document.createElement('div');
    tmp.innerHTML = renderBody(node.body);
    const out = [];
    for (const el of tmp.children) {
      if (el.tagName === 'UL') { for (const li of el.children) out.push({ html: li.innerHTML, bullet: true }); }
      else out.push({ html: el.innerHTML, bullet: false });
    }
    return out.length ? out : [{ html: '<span class="empty">(no text under this heading)</span>', bullet: false }];
  }
  const lineH = () => Math.round(settings.font * 1.3);
  function layoutAnswer() {
    const answer = $('#answer'), col = $('#answer .col');
    if (!answer || !col || !cur || cur.children.length) return;
    if (cur !== lastLeaf) { items = extractItems(cur); itemIdx = 0; lastLeaf = cur; }
    const lh = lineH(), H = answer.clientHeight;
    const colW = Math.min(settings.colW, answer.clientWidth);
    let avail = H;
    if (settings.eyes) {
      const aRect = answer.getBoundingClientRect(), eRect = $('#eyes').getBoundingClientRect();
      const colLeft = aRect.left + (aRect.width - colW) / 2, colRight = colLeft + colW;
      if (eRect.top < aRect.top + H && eRect.bottom > aRect.top && colRight > eRect.left - 8 && colLeft < eRect.right + 8)
        avail = Math.max(0, eRect.top - aRect.top - 6);
    }
    const rows = Math.max(1, Math.floor(avail / lh));
    col.style.width = colW + 'px';
    col.style.height = (rows * lh) + 'px';
    col.style.lineHeight = lh + 'px';
    col.dataset.step = rows * lh;
    showItem();
  }
  function wrapWords(root) {
    const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
    const texts = []; while (walker.nextNode()) texts.push(walker.currentNode);
    for (const t of texts) {
      const frag = document.createDocumentFragment();
      for (const part of t.nodeValue.split(/(\s+)/)) {
        if (!part) continue;
        if (/^\s+$/.test(part)) frag.appendChild(document.createTextNode(' '));
        else { const w = document.createElement('span'); w.className = 'w'; w.textContent = part; frag.appendChild(w); }
      }
      t.parentNode.replaceChild(frag, t);
    }
  }
  function placeCaterpillar() {
    const cat = $('#cat'), col = $('#answer .col'), answer = $('#answer');
    if (!cat || !col) return;
    const moreBelow = col.scrollTop + col.clientHeight < col.scrollHeight - 2;
    if (!moreBelow) { cat.style.display = 'none'; return; }
    const cRect = col.getBoundingClientRect(), aRect = answer.getBoundingClientRect();
    let last = null;
    for (const w of col.querySelectorAll('.w')) {
      const r = w.getBoundingClientRect();
      if (r.top >= cRect.top - 0.5 && r.bottom <= cRect.bottom + 0.5) last = r;
    }
    if (!last) { cat.style.display = 'none'; return; }
    cat.style.display = 'block';
    cat.style.left = (last.right - aRect.left + 6) + 'px';
    cat.style.top = (last.top - aRect.top) + 'px';
    cat.style.lineHeight = last.height + 'px';
  }
  function showItem() {
    const col = $('#answer .col'); if (!col) return;
    itemIdx = Math.max(0, Math.min(itemIdx, items.length - 1));
    const it = items[itemIdx];
    col.innerHTML = it.bullet
      ? `<div class="item bullet"><span class="dot">•</span><span class="txt">${it.html}</span></div>`
      : `<div class="item">${it.html}</div>`;
    wrapWords(col.querySelector('.txt') || col.firstElementChild);
    const step = +col.dataset.step || col.clientHeight;
    const h = col.firstElementChild.getBoundingClientRect().height;
    const lh = parseFloat(col.style.lineHeight) || lineH();
    const lines = Math.ceil((h - 1) / lh) * lh;
    const pad = Math.ceil(lines / step) * step - h;
    if (pad > 0.5) { const sp = document.createElement('div'); sp.style.height = pad + 'px'; col.insertBefore(sp, col.firstChild); }
    col.scrollTop = 0;
    updateCounter();
  }
  function updateCounter() {
    const col = $('#answer .col'), c = $('#counter');
    if (!c) return;
    if (!col) { c.classList.remove('on'); return; }
    const moreBelow = col.scrollTop + col.clientHeight < col.scrollHeight - 2;
    c.textContent = `${itemIdx + 1} / ${items.length}${moreBelow ? ' ▼' : ''}`;
    c.classList.add('on');
    placeCaterpillar();
  }

  // ---------- Navigation ----------
  const drill = i => { if (cur.children[i]) { cur = cur.children[i]; render(); } };
  const back = () => { if (cur.parent) { cur = cur.parent; render(); } };
  const home = () => { cur = root; render(); };
  let flashing = false;
  function flashButterfly(then) {
    flashing = true;
    document.body.classList.add('flash');
    setTimeout(() => { document.body.classList.remove('flash'); flashing = false; then && then(); }, 350);
  }
  const scroll = dir => {
    const col = $('#answer .col'); if (!col || flashing) return;
    const step = +col.dataset.step || col.clientHeight;
    if (dir > 0) {
      if (col.scrollTop + col.clientHeight < col.scrollHeight - 2) col.scrollTop += step;
      else flashButterfly(() => { if (itemIdx < items.length - 1) { itemIdx++; showItem(); } });
    } else {
      if (col.scrollTop > 2) col.scrollTop -= step;
      else flashButterfly(() => { if (itemIdx > 0) { itemIdx--; showItem(); } });
    }
    updateCounter();
  };
  const toggleBlank = () => document.body.classList.toggle('blank');
  const toggleStrip = () => { settings.strip = !settings.strip; applySettings(); };
  const cycleFont = () => { const sizes = [22, 28, 34, 42]; settings.font = sizes.find(s => s > settings.font) || sizes[0]; applySettings(); };

  // ---------- Panels ----------
  const panel = id => $('#' + id);
  const isOpen = id => panel(id).classList.contains('open');
  const closeAll = () => { panel('settings').classList.remove('open'); panel('editor').classList.remove('open'); };
  const toggle = id => { const was = isOpen(id); closeAll(); if (!was) { panel(id).classList.add('open'); if (id === 'editor') $('#mdText').focus(); } };

  function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('on'), 2200); }

  // ---------- Keys ----------
  document.addEventListener('keydown', e => {
    const k = e.key;
    if (isOpen('editor')) {
      if (k === 'Escape') { closeAll(); e.preventDefault(); }
      else if ((e.metaKey || e.ctrlKey) && k.toLowerCase() === 's') { load($('#mdText').value, 'Saved'); closeAll(); e.preventDefault(); }
      return;
    }
    if (isOpen('settings') && (k === 'Escape' || k.toLowerCase() === 's')) { closeAll(); e.preventDefault(); return; }
    if (e.altKey && e.shiftKey && e.code === 'KeyY') { settings.eyes = !settings.eyes; applySettings(); toast(settings.eyes ? 'Eyes on' : 'Eyes off'); e.preventDefault(); return; }
    if (e.metaKey || e.ctrlKey || e.altKey) return;

    if (k === '.' || k === 'Escape') { toggleBlank(); e.preventDefault(); return; }
    if (document.body.classList.contains('blank')) document.body.classList.remove('blank');

    if (k >= '1' && k <= '9') drill(+k - 1);
    else if (k === 'Backspace' || k === '/' || k === 'ArrowLeft') back();
    else if (k === '0' || k === 'Home') home();
    else if (k === '+' || k === '=' || k === 'ArrowDown' || k === 'PageDown' || k === ' ') scroll(1);
    else if (k === '-' || k === '_' || k === 'ArrowUp' || k === 'PageUp') scroll(-1);
    else if (k === '*') cycleFont();
    else if (k.toLowerCase() === 'f') toggleStrip();
    else if (k.toLowerCase() === 'e') toggle('editor');
    else if (k.toLowerCase() === 'o') $('#file').click();
    else if (k.toLowerCase() === 's') toggle('settings');
    else if (k.toLowerCase() === 'h') { settings.hints = !settings.hints; applySettings(); }
    else return;
    e.preventDefault();
  });

  $('#hints').innerHTML = ['<kbd>1-9</kbd> pick', '<kbd>⌫</kbd> back', '<kbd>0</kbd> home', '<kbd>.</kbd> blank',
    '<kbd>+ −</kbd> next / prev', '<kbd>*</kbd> font', '<kbd>F</kbd> strip', '<kbd>E</kbd> edit', '<kbd>O</kbd> open',
    '<kbd>S</kbd> settings', '<kbd>H</kbd> hide this'].join(' · ');

  // ---------- Settings controls ----------
  $('#optStrip').onchange = e => { settings.strip = e.target.checked; applySettings(); };
  $('#optHalf').onchange = e => { settings.half = e.target.checked; applySettings(); };
  $('#optLower').oninput = e => { settings.lower = e.target.value; applySettings(); };
  $('#optTopbar').oninput = e => { settings.topbar = +e.target.value; applySettings(); };
  $('#optStripH').oninput = e => { settings.stripH = +e.target.value; applySettings(); };
  $('#optFont').oninput = e => { settings.font = +e.target.value; applySettings(); };
  $('#optColW').oninput = e => { settings.colW = +e.target.value; applySettings(); };
  $('#optHints').onchange = e => { settings.hints = e.target.checked; applySettings(); };
  $('#optEyes').onchange = e => { settings.eyes = e.target.checked; applySettings(); };
  $('#optEyeW').oninput = e => { settings.eyeW = +e.target.value; applySettings(); };

  // ---------- Editor controls ----------
  $('#btnSave').onclick = () => { load($('#mdText').value, 'Saved'); closeAll(); };
  $('#btnOpen').onclick = () => $('#file').click();
  $('#btnClear').onclick = () => { $('#mdText').value = ''; $('#mdText').focus(); };
  $('#btnDownload').onclick = () => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([$('#mdText').value], { type: 'text/markdown' }));
    a.download = 'answers.md'; a.click(); URL.revokeObjectURL(a.href);
  };

  // ---------- File open / drop ----------
  function readFile(file) {
    if (!file) return;
    const r = new FileReader();
    r.onload = () => { load(r.result, file.name); closeAll(); };
    r.readAsText(file);
  }
  $('#file').onchange = e => { readFile(e.target.files[0]); e.target.value = ''; };
  let dragDepth = 0;
  document.addEventListener('dragenter', e => { e.preventDefault(); if (++dragDepth === 1) document.body.classList.add('dragging'); });
  document.addEventListener('dragleave', e => { e.preventDefault(); if (--dragDepth === 0) document.body.classList.remove('dragging'); });
  document.addEventListener('dragover', e => e.preventDefault());
  document.addEventListener('drop', e => { e.preventDefault(); dragDepth = 0; document.body.classList.remove('dragging'); readFile(e.dataTransfer.files[0]); });

  // ---------- Blink ----------
  (function blinkLoop() {
    const eyes = $('#eyes');
    const blink = () => { eyes.classList.add('blink'); setTimeout(() => eyes.classList.remove('blink'), 110); };
    const next = () => {
      setTimeout(() => {
        blink();
        if (Math.random() < 0.18) setTimeout(blink, 260);
        next();
      }, 2200 + Math.random() * 3800);
    };
    next();
  })();

  // ---------- Keep the screen awake, work offline ----------
  let wakeLock = null;
  async function keepAwake() {
    if (!('wakeLock' in navigator) || wakeLock) return;
    try {
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', () => { wakeLock = null; });
    } catch (e) { wakeLock = null; }
  }
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') keepAwake(); });
  document.addEventListener('keydown', () => keepAwake(), { passive: true });
  document.addEventListener('pointerdown', () => keepAwake(), { passive: true });
  keepAwake();  // granted at load on Chrome/Firefox; Safari and iOS only grant it from a key press or tap, handled above
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || ['localhost', '127.0.0.1'].includes(location.hostname))) {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
    // A new version took over while this page was running: it is used on the next fresh launch.
    const hadController = !!navigator.serviceWorker.controller;
    navigator.serviceWorker.addEventListener('controllerchange', () => { if (hadController) toast('Update downloaded. Quit and reopen to use it.'); });
  }

  // ---------- Boot ----------
  applySettings();
  const saved = store.get('md', null);
  load(saved !== null ? saved : '');
  let resizeRaf = 0;
  window.addEventListener('resize', () => { cancelAnimationFrame(resizeRaf); resizeRaf = requestAnimationFrame(() => { if (cur) render(); }); });
})();
</script>
</body>
</html>
